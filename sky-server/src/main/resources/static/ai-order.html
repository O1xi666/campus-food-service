<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智能点餐 - 校园餐饮</title>
    <style>
        :root {
            --primary-color: #ff6b01;
            --bg-color: #f5f5f5;
            --card-bg: #ffffff;
            --text-main: #333;
            --text-sub: #666;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        body { background: var(--bg-color); color: var(--text-main); padding-bottom: 90px; }

        .header {
            background: linear-gradient(135deg, #ff9000, #ff6b01);
            color: #fff; padding: 20px; text-align: center;
            box-shadow: 0 2px 10px rgba(255, 107, 1, .3);
        }
        .header h1 { font-size: 1.5rem; margin-bottom: 5px; }
        .header p { font-size: .9rem; opacity: .9; }

        .wrap { max-width: 900px; margin: 0 auto; padding: 16px; }

        .panel { background: var(--card-bg); border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
        .panel h3 { font-size: 1rem; margin-bottom: 10px; }
        .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        input[type=text], input[type=password] {
            flex: 1; min-width: 140px; padding: 9px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: .9rem;
        }
        button { cursor: pointer; border: none; border-radius: 8px; padding: 9px 16px; font-size: .9rem; font-weight: 600; }
        .btn-main { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; }
        .btn-plain { background: #f0f0f0; color: #444; }
        .btn-main:disabled { opacity: .6; cursor: not-allowed; }

        .ai-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff; border-radius: 12px; padding: 18px; margin-bottom: 16px;
        }
        .ai-card h3 { font-size: 1.1rem; margin-bottom: 6px; }
        .ai-card p { font-size: .86rem; opacity: .9; margin-bottom: 12px; }
        .ai-card input { border: none; }

        .ai-result {
            background: var(--card-bg); border-left: 4px solid #764ba2; border-radius: 8px;
            padding: 14px; margin-bottom: 16px; font-size: .9rem; line-height: 1.7;
            white-space: pre-wrap; word-break: break-word; display: none;
        }
        .ai-result.show { display: block; }

        .filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; }
        .filter-tag {
            background: #fff; padding: 6px 14px; border-radius: 20px; font-size: .88rem;
            color: var(--text-sub); border: 1px solid #ddd; white-space: nowrap; cursor: pointer;
        }
        .filter-tag.active { background: var(--primary-color); color: #fff; border-color: var(--primary-color); }

        .dish-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
        .dish-card { background: var(--card-bg); border-radius: 12px; padding: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.06); display: flex; flex-direction: column; justify-content: space-between; }
        .dish-name { font-weight: 700; font-size: 1rem; margin-bottom: 6px; }
        .dish-desc { color: var(--text-sub); font-size: .82rem; line-height: 1.5; min-height: 34px; }
        .dish-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        .dish-price { color: var(--primary-color); font-weight: 700; }
        .dish-price::before { content: '¥'; font-size: .8rem; }
        .add-btn { background: var(--primary-color); color: #fff; width: 34px; height: 34px; border-radius: 50%; font-size: 1.1rem; padding: 0; }
        .stock { font-size: .76rem; color: #999; margin-top: 4px; }

        .cart-bar {
            position: fixed; left: 0; right: 0; bottom: 0; background: #fff; display: none;
            justify-content: space-between; align-items: center; padding: 14px 20px;
            box-shadow: 0 -2px 12px rgba(0,0,0,.08);
        }
        .cart-total { color: var(--primary-color); font-weight: 700; font-size: 1.1rem; }
        .cart-count { color: var(--text-sub); font-size: .82rem; margin-left: 10px; }
        .checkout-btn { background: linear-gradient(135deg, #ff9000, #ff6b01); color: #fff; padding: 10px 26px; border-radius: 22px; }

        .toast {
            position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,.8); color: #fff; padding: 10px 18px; border-radius: 8px;
            font-size: .86rem; display: none; z-index: 999; max-width: 90%;
        }
        .toast.show { display: block; }
        .hint { color: var(--text-sub); font-size: .82rem; }
    </style>
</head>
<body>

<div class="header">
    <h1>🤖 AI 智能点餐</h1>
    <p>告诉我想吃什么，由大模型结合你的历史订单给出推荐</p>
</div>

<div class="wrap">

    <!-- 登录态 -->
    <div class="panel" id="authPanel">
        <h3>用户登录</h3>
        <div class="row" id="loginRow">
            <input type="text" id="username" placeholder="用户名" value="student1">
            <input type="password" id="password" placeholder="密码" value="123456">
            <button class="btn-main" onclick="doLogin()">登录</button>
            <button class="btn-plain" onclick="doRegister()">注册</button>
        </div>
        <div class="row" id="loggedRow" style="display:none">
            <span class="hint" id="whoami">已登录</span>
            <button class="btn-plain" onclick="doLogout()">退出</button>
        </div>
    </div>

    <!-- AI 推荐 -->
    <div class="ai-card">
        <h3>AI 智能推荐</h3>
        <p>链路：历史订单画像 → 规则粗召回 Top10 → 大模型重排序并生成推荐理由</p>
        <div class="row">
            <input type="text" id="preference" placeholder="例如：想吃辣一点、预算 20 左右、不要汤">
            <button class="ai-btn btn-main" id="aiBtn" onclick="askAI()">让 AI 推荐</button>
        </div>
    </div>
    <div class="ai-result" id="aiResult"></div>

    <!-- 筛选 -->
    <div class="filters" id="filterContainer">
        <div class="filter-tag active" data-filter="all">全部</div>
        <div class="filter-tag" data-filter="辣">🌶️ 辣的</div>
        <div class="filter-tag" data-filter="汤">🍲 带汤的</div>
        <div class="filter-tag" data-filter="饭">🍚 主食饭</div>
        <div class="filter-tag" data-filter="鸡">🍗 鸡肉</div>
    </div>

    <!-- 菜品列表 -->
    <div class="dish-list" id="dishList"></div>

</div>

<!-- 底部购物车 -->
<div class="cart-bar" id="cartBar">
    <div>
        <span class="cart-total" id="totalPrice">¥0.00</span>
        <span class="cart-count" id="totalCount">共 0 件商品</span>
    </div>
    <button class="checkout-btn" onclick="checkout()">去结算</button>
</div>

<div class="toast" id="toast"></div>

<script>
    const TOKEN_KEY = 'sky_user_token';
    let token = localStorage.getItem(TOKEN_KEY) || '';
    let dishes = [];
    let cartList = [];

    function toast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(el._timer);
        el._timer = setTimeout(() => el.classList.remove('show'), 2600);
    }

    /** 统一请求：解开 Result{code,msg,data} 包装，失败时抛出后端 msg */
    async function api(path, options) {
        const opts = options || {};
        opts.headers = Object.assign(
            { 'Content-Type': 'application/json' },
            token ? { 'token': token } : {},
            opts.headers || {}
        );
        const res = await fetch(path, opts);
        const text = await res.text();
        let body = null;
        try { body = text ? JSON.parse(text) : null; } catch (e) { body = null; }
        if (res.status === 401) { doLogout(); throw new Error('登录已失效，请重新登录'); }
        if (!res.ok) { throw new Error((body && (body.msg || body.message)) || ('HTTP ' + res.status)); }
        if (body && body.code !== undefined && body.code !== 1) { throw new Error(body.msg || '请求失败'); }
        return body ? body.data : null;
    }

    // ---------------- 登录 ----------------
    function renderAuth() {
        const logged = !!token;
        document.getElementById('loginRow').style.display = logged ? 'none' : 'flex';
        document.getElementById('loggedRow').style.display = logged ? 'flex' : 'none';
        document.getElementById('whoami').textContent = '已登录，token 前 8 位：' + (token ? token.slice(0, 8) : '');
    }

    async function doLogin() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        if (!username || !password) { toast('请填写用户名和密码'); return; }
        try {
            const data = await api('/user/auth/login', { method: 'POST', body: JSON.stringify({ username, password }) });
            token = data.token;
            localStorage.setItem(TOKEN_KEY, token);
            renderAuth();
            toast('登录成功');
            loadCart();
        } catch (e) { toast('登录失败：' + e.message); }
    }

    async function doRegister() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        if (!username || !password) { toast('请填写用户名和密码'); return; }
        try {
            await api('/user/auth/register', { method: 'POST', body: JSON.stringify({ username, password }) });
            toast('注册成功，正在登录');
            doLogin();
        } catch (e) { toast('注册失败：' + e.message); }
    }

    function doLogout() {
        token = '';
        localStorage.removeItem(TOKEN_KEY);
        cartList = [];
        renderAuth();
        renderCart();
    }

    // ---------------- 菜品 ----------------
    async function loadDishes() {
        try {
            dishes = (await api('/user/dish/list')) || [];
            renderDishes('all');
        } catch (e) { toast('菜品加载失败：' + e.message); }
    }

    function renderDishes(filter) {
        const container = document.getElementById('dishList');
        const list = (filter === 'all')
            ? dishes
            : dishes.filter(d => ((d.name || '') + (d.description || '')).includes(filter));
        if (!list.length) {
            container.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:#999;">暂无相关菜品</div>';
            return;
        }
        container.innerHTML = list.map(d => `
            <div class="dish-card">
                <div>
                    <div class="dish-name">${escapeHtml(d.name)}</div>
                    <div class="dish-desc">${escapeHtml(d.description || '')}</div>
                    <div class="stock">库存：${d.stock == null ? '不限' : d.stock}</div>
                </div>
                <div class="dish-meta">
                    <div class="dish-price">${Number(d.price || 0).toFixed(2)}</div>
                    <button class="add-btn" onclick="addToCart(${d.id})">+</button>
                </div>
            </div>`).join('');
    }

    function escapeHtml(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // ---------------- 购物车 ----------------
    async function addToCart(dishId) {
        if (!token) { toast('请先登录'); return; }
        try {
            await api('/user/shoppingCart/add', { method: 'POST', body: JSON.stringify({ dishId }) });
            toast('已加入购物车');
            loadCart();
        } catch (e) { toast('加购失败：' + e.message); }
    }

    async function loadCart() {
        if (!token) { cartList = []; renderCart(); return; }
        try {
            cartList = (await api('/user/shoppingCart/list')) || [];
            renderCart();
        } catch (e) { cartList = []; renderCart(); }
    }

    function renderCart() {
        const bar = document.getElementById('cartBar');
        const count = cartList.reduce((s, i) => s + (i.number || 0), 0);
        if (!count) { bar.style.display = 'none'; return; }
        const total = cartList.reduce((s, i) => s + Number(i.amount || 0) * (i.number || 0), 0);
        bar.style.display = 'flex';
        document.getElementById('totalPrice').textContent = '¥' + total.toFixed(2);
        document.getElementById('totalCount').textContent = '共 ' + count + ' 件商品';
    }

    async function checkout() {
        if (!cartList.length) { toast('购物车是空的'); return; }
        try {
            const address = await api('/user/addressBook/default');
            if (!address) { toast('请先在地址簿中设置默认地址'); return; }
            const cartIds = cartList.map(i => i.id).join(',');
            const result = await api('/user/order/submit/cart?cartIds=' + cartIds, {
                method: 'POST',
                body: JSON.stringify({
                    addressBookId: address.id,
                    payMethod: 1,
                    remark: 'AI 推荐页下单',
                    deliveryStatus: 1,
                    tablewareNumber: 1,
                    tablewareStatus: 1,
                    packAmount: 0,
                    amount: Number(document.getElementById('totalPrice').textContent.replace('¥', ''))
                })
            });
            toast('下单成功，订单号：' + (result && result.orderNumber ? result.orderNumber : '已提交'));
            loadCart();
        } catch (e) { toast('下单失败：' + e.message); }
    }

    // ---------------- AI 推荐 ----------------
    async function askAI() {
        if (!token) { toast('请先登录'); return; }
        const btn = document.getElementById('aiBtn');
        const box = document.getElementById('aiResult');
        const preference = document.getElementById('preference').value.trim() || '随便吃点';
        btn.disabled = true;
        btn.textContent = 'AI 思考中...';
        box.classList.add('show');
        box.textContent = '正在构建用户画像并调用大模型，请稍候（首次调用通常 3-10 秒）...';
        try {
            const answer = await api('/user/ai/recommend?preference=' + encodeURIComponent(preference));
            box.textContent = answer;
        } catch (e) {
            box.textContent = 'AI 推荐失败：' + e.message;
        } finally {
            btn.disabled = false;
            btn.textContent = '让 AI 推荐';
        }
    }

    // ---------------- 事件 ----------------
    document.querySelectorAll('.filter-tag').forEach(tag => {
        tag.addEventListener('click', function () {
            document.querySelectorAll('.filter-tag').forEach(t => t.classList.remove('active'));
            this.classList.add('active');
            renderDishes(this.dataset.filter);
        });
    });

    renderAuth();
    loadDishes();
    loadCart();
</script>
</body>
</html>
